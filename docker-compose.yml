version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: sentinel_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=sentinel_secret

  backend:
    build: 
      context: .
      dockerfile: server/Dockerfile
    container_name: sentinel_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://admin:sentinel_secret@mongodb:27017/sentinel?authSource=admin
      - NODE_ENV=production
      - PORT=5001
      - JWT_SECRET=votre_super_secret_jwt
      # Les dossiers d'IA modèles doivent être mappés via volumes s'ils sont ignorés au build
    volumes:
      - ./ai_models:/app/ai_models
      - ./sentinel_data:/app/sentinel_data
      - ./server/data:/app/server/data

volumes:
  mongodb_data:
